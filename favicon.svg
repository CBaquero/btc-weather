<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sun" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="0.7" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#e07b00"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c5cfd9"/>
    </linearGradient>
  </defs>

  <!-- Sun rays -->
  <g stroke="#f5a623" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="24" y1="3"  x2="24" y2="9"/>
    <line x1="3"  y1="24" x2="9"  y2="24"/>
    <line x1="10" y1="10" x2="14" y2="14"/>
    <line x1="38" y1="10" x2="34" y2="14"/>
    <line x1="24" y1="39" x2="24" y2="44"/>
    <line x1="38" y1="38" x2="34" y2="34"/>
  </g>

  <!-- Sun body -->
  <circle cx="24" cy="24" r="14" fill="url(#sun)" stroke="#c66a00" stroke-width="0.5"/>

  <!-- BTC symbol -->
  <text x="24" y="31" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-weight="900" font-size="22" fill="#ffffff">₿</text>

  <!-- Cloud (overlaps lower-right of sun) -->
  <path d="M 28 53
           C 23 53, 22 47, 27 46
           C 27 41, 33 39, 37 42
           C 39 38, 47 38, 49 44
           C 56 43, 60 50, 55 55
           L 28 55
           Z"
        fill="url(#cloud)" stroke="#7d8a99" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
