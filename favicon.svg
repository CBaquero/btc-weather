<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sun" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="0.7" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#e07b00"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c5cfd9"/>
    </linearGradient>
  </defs>

  <!-- Sun rays (upper-left half only, since cloud covers lower-right) -->
  <g stroke="#f5a623" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="24" y1="3"  x2="24" y2="9"/>
    <line x1="3"  y1="24" x2="9"  y2="24"/>
    <line x1="10" y1="10" x2="14" y2="14"/>
    <line x1="38" y1="10" x2="34" y2="14"/>
    <line x1="6"  y1="38" x2="10" y2="34"/>
  </g>

  <!-- Sun body -->
  <circle cx="24" cy="24" r="14" fill="url(#sun)" stroke="#c66a00" stroke-width="0.5"/>

  <!-- BTC symbol on sun -->
  <text x="24" y="31" text-anchor="middle"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-weight="900" font-size="22" fill="#ffffff">₿</text>

  <!-- Cloud — overlaps lower-right of sun, with multiple soft bumps -->
  <g fill="url(#cloud)" stroke="#7d8a99" stroke-width="1" stroke-linejoin="round">
    <ellipse cx="34" cy="38" rx="7" ry="6"/>
    <ellipse cx="45" cy="35" rx="9" ry="7"/>
    <ellipse cx="54" cy="40" rx="7" ry="6"/>
    <rect x="32" y="38" width="25" height="10" rx="5"/>
  </g>
</svg>
